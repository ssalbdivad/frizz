<!doctype html>
<!-- Source for public/img/og.png (1200x630). Not deployed. Regenerate with:
     node scripts/shot.mjs http://127.0.0.1:8765/og/og.html site/public/img/og.png "" --w=1200 --h=630 --dsf=1 --wait=1500
     with `python3 -m http.server 8765 --directory site` running. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/og/og.css" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d0e10; }
      .og { display: grid; grid-template-columns: 300px 1fr; gap: 72px; align-items: center; height: 630px; padding: 0 96px; }
      .og img { width: 300px; height: 300px; display: block; }
      .og h1 { font-size: 60px; line-height: 1.06; letter-spacing: -0.035em; margin: 0 0 24px; max-width: 16ch; }
      .og p { font: 24px/1.4 var(--sans); color: var(--muted); margin: 0; max-width: 24ch; }
      .og code { font-size: 24px; color: var(--fg); }
      .og .prompt { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="og">
      <img src="/public/img/og-mark.svg" alt="" />
      <div>
        <h1>An opinionated agent console.</h1>
        <p>Run many Claude Code, Codex and other agents at once from one browser tab.</p>
        <p style="margin-top:28px"><code><span class="prompt">$</span> npx frizz</code></p>
      </div>
    </div>
  </body>
</html>
