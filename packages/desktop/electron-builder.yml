# Packaging for the desktop shell. electron-builder is fetched on demand by `nub run desktop:dist`
# rather than installed with the workspace: it is ~94 MB of tooling nobody but a packager needs.
appId: dev.frizz.app
productName: Frizz
# Not "frizz": a .deb links its executable onto the PATH, where it would shadow the `frizz` CLI. Linux and
# Windows only — macOS overrides it below, because there it names the bundle the user sees.
executableName: frizz-desktop
# The packaged manifest's name. The workspace's is scoped (@frizz/desktop), and electron-builder derives
# directory names from it: the Windows installer would put the app in %LOCALAPPDATA%\Programs\ under the
# scope-mangled name (NsisTarget.js, getWindowsInstallationDirName). Nothing at runtime reads it — main.ts
# names the app and its userData itself.
extraMetadata:
  name: frizz-desktop
directories:
  output: out
# The app is two bundled files and an icon. No server and no node_modules ship inside it — the server
# is the one `npx frizz` installs and keeps updated, so this binary never goes stale with it.
files:
  - dist/**
  - package.json
  # This package has no runtime dependencies, and finding none, electron-builder falls back to the
  # WORKSPACE root and bundles its dependencies (@parcel/watcher, native binary and all).
  - "!**/node_modules/**"
asar: true
electronLanguages: [en-US]
icon: dist/icon.png
publish: null
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
# Every installer is named for its platform and architecture, so a release page of five of them reads
# at a glance. arm64 is Apple silicon; the deb keeps Debian's own naming.
mac:
  target: [dmg]
  # The top-level executableName would make this frizz-desktop.app: that name in Finder and Launchpad and on
  # the DMG's volume, and a later Frizz.app would install BESIDE it rather than replacing it.
  executableName: Frizz
  artifactName: Frizz-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  # Ad-hoc: an arm64 app with no signature at all is reported as "damaged" and cannot be opened.
  # This is not notarization — a browser-downloaded build still needs Open Anyway once.
  identity: "-"
  hardenedRuntime: false
linux:
  # deb first: electron-builder 26's AppImage needs libfuse2, which Ubuntu 24.04 no longer installs.
  target: [deb, AppImage]
  category: Development
  # Ties the running window to the installed .desktop entry (its WM_CLASS), so the taskbar shows one
  # Frizz rather than an anonymous Electron window beside a launcher icon.
  syncDesktopName: true
appImage:
  artifactName: Frizz-${version}-linux-${arch}.${ext}
deb:
  # The npm name (@frizz/desktop) is not a Debian package name, and its slash would become a directory.
  packageName: frizz-desktop
  artifactName: frizz-desktop_${version}_${arch}.${ext}
  # electron-builder's own list (FpmTarget.js getDefaultDepends — a list here REPLACES it, so it is
  # restated) omits two libraries Electron links. A desktop install has them anyway; a lean one does
  # not, and the app then dies at load with "libasound.so.2: cannot open shared object file" — measured
  # on clean ubuntu:22.04, ubuntu:24.04 and debian:12, and WSL's Ubuntu ships no ALSA either. 22.04 also
  # lacks libgbm. libasound2 became libasound2t64 in Ubuntu 24.04 and Debian 13, hence the alternative.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
win:
  target: [nsis]
nsis:
  artifactName: Frizz-${version}-win-${arch}-setup.${ext}
