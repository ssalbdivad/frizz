name: release

# Publishes `frizz` from the `release` branch — NOT from main — and only when a maintainer
# dispatches it by hand. See the `on:` block for why the push trigger is gone.
#
# WHAT CHANGED, AND WHY (2026-09-08). This published on every push to main that touched package.json.
# That is the natural shape for a repo that lands straight on main, and it worked until releasing
# became a standing automated job rather than something a human did while holding the whole tree in
# their head. The problem is that main moves under you: several agents land on it continuously, so the
# commit you verified and the commit that publishes are routinely not the same one, and a release
# carries whatever happened to arrive in between. Nobody chose to ship that work; it was simply
# adjacent.
#
# So the two questions are now separated. Main answers "has this landed?". `release` answers "has this
# been VERIFIED and chosen to ship?" — and only the second one publishes.
#
# THE BRANCH IS A FAST-FORWARD POINTER INTO MAIN, never a fork. It holds no commits of its own: you
# pick the main commit you actually tested and move `release` to it. That keeps the published tree a
# real snapshot of main with no merge to reconcile and nothing to cherry-pick, while still letting you
# leave later, unverified commits behind. If `release` ever needs a non-fast-forward push, something
# has gone wrong — stop and look rather than forcing it.
#
# THE CONSEQUENCE TO KNOW ABOUT: bumping the version on main and pushing NO LONGER PUBLISHES, and
# since 2026-09-23 neither does moving `release` — nothing publishes until a maintainer dispatches
# this workflow. That silence is deliberate, but it is silence, so the procedure lives in
# plans/runtime-pin-bumps.md and the check for an unshipped bump runs on the daily runtime watch.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN, no secret to rotate or leak. That binds the
# right to publish to THIS repository and THIS workflow file — the filename is load-bearing, and
# renaming release.yml breaks publishing until the trusted publisher is reconfigured on npmjs.com. It
# does NOT bind a branch (npm's trusted publisher takes org, repo, workflow filename and an optional
# environment, and this workflow declares no environment), which is what makes publishing from
# `release` work at all. Trusted publishing attaches provenance automatically; --provenance is
# unnecessary.
#
# STAGED PUBLISHING WAS TRIED AND DROPPED. From 2026-09-22 the trusted publisher on `frizz` and on
# `frizz-server` was stage-only: this workflow ran `npm stage publish`, and neither version was
# installable until the maintainer approved it with 2FA. That put a proof of presence no stolen
# credential can supply between CI and the registry — the answer to the 2026-09-21 nubjs/nub
# compromise, where a stolen push credential cut a tag and 18 packages published unattended. But it
# put a 2FA approval in front of EVERY release, and the job's approval wait gave up after 350
# minutes anyway, so a late approval cost a re-run too. The maintainer dropped it on 2026-09-30 as
# too onerous. Releases publish directly again, which needs the trusted publisher on npmjs.com to
# allow `npm publish`. The dispatch-only trigger below STAYS: it is what still stops a stolen push
# credential from starting a release.
#
# ORDER IS THE WORKFLOW'S JOB AGAIN. A `frizz` shell fetches the `frizz-server` version pinned in
# its own manifest from the registry on first boot, so a shell that goes live before that server
# does is broken for anyone who installs it in between. With staging, the order of the two approvals
# enforced that; now the steps do — publish the server, wait until npm serves it, then publish the
# shell. And because npm holds every new version in automated review before serving it, the tag and
# the GitHub release still wait for the registry, so neither describes a version npm does not serve.

on:
  # DISPATCH ONLY (2026-09-23), and deliberately so. A `workflow_dispatch` needs a GitHub session or
  # token carrying write access; a stolen git push credential carries neither, so moving `release`
  # now starts nothing. That closes the last automatic path from a push to a package: the 2026-09-21
  # compromise above needed only a push credential.
  #
  # Releasing is therefore two deliberate acts — fast-forward `release` to the verified commit, then
  # `gh workflow run release.yml --ref release`. The branch still decides WHAT ships; the dispatch
  # decides WHEN. Dispatching against any other ref is refused by the first step of the job below.
  #
  # The push trigger this replaces deliberately carried NO path filter, because a path filter tests
  # the files changed in the pushed range and `release` advances by fast-forwarding over several main
  # commits at once, so the version bump normally sat mid-range rather than in the diff (measured
  # 2026-09-08: neither the creating push nor the next fast-forward fired, and both releases had to
  # be dispatched by hand anyway). A dispatch has no range at all, so that whole hazard is gone. The
  # workflow stays idempotent by construction either way: it asks the registry whether each version
  # exists and no-ops when it does, so a re-dispatch is always safe.
  workflow_dispatch:

# Two releases racing would fight over the same version; let an in-flight one finish rather than
# cancelling it mid-publish.
concurrency:
  group: release-frizz
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Six hours is a GitHub job's maximum, not a tunable. npm's review of a new version can take
    # hours (see npm-wait-served.sh for the measurements), and this job waits it out twice — the
    # server before the shell publishes, the shell before the tag — against one shared deadline set
    # under this cap, so a stall is reported by the wait step, not by a job timeout. A version npm
    # serves later is not lost: re-run the job and it resumes from there.
    timeout-minutes: 360
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
      contents: write # tag the released commit and create the GitHub release
    steps:
      # `release`, not main: this repo publishes the commit someone verified and moved the branch to,
      # never whatever main happens to hold (see the header). A step rather than a job-level `if:`,
      # because a skipped job is silent — the run would go green having released nothing while
      # looking like it had.
      - name: Refuse to release from any ref but release
        run: |
          [ "$GITHUB_REF" = "refs/heads/release" ] || { echo "::error::release.yml runs from the release branch only, got $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          # Without an explicit registry-url npm has no registry to exchange the OIDC token against.
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1. The npm bundled with a Node image can lag it, so pin
      # the major and assert the floor rather than take whatever `npm@latest` resolves to.
      - name: Install an npm CLI that supports trusted publishing
        run: |
          npm install -g npm@11
          v="$(npm --version)"
          # `sort -V | head -1` yields the smaller of the two; it must be the floor.
          [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -1)" = "11.5.1" ] \
            || { echo "::error::npm $v cannot use trusted publishing (need >= 11.5.1)"; exit 1; }
          echo "npm $v"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # A release must not be the first time the tree is compiled. The full suite is deliberately NOT
      # a gate here: it drives real provider CLIs and has never run on a CI box, so making it block
      # publishing would break releases for reasons unrelated to the release. (It used to drive tmux
      # too; that transport is gone.)
      - name: Typecheck
        run: pnpm run typecheck

      - name: Resolve versions and decide what to publish
        id: decide
        run: |
          SHELL_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./packages/server-release/package.json').version")
          echo "version=$SHELL_VERSION" >> "$GITHUB_OUTPUT"
          echo "server_version=$SERVER_VERSION" >> "$GITHUB_OUTPUT"
          # The one deadline both registry waits below share: 340 minutes from here leaves the
          # install and typecheck above, and the tag and release below, inside the 360-minute cap.
          echo "RELEASE_DEADLINE=$(( $(date +%s) + 340 * 60 ))" >> "$GITHUB_ENV"
          # Registry checks, rather than commit diffs, make retries idempotent. Server releases are
          # intentionally independent: a compatible runtime fix can publish without moving the shell.
          # A version npm accepted but still holds in review is not served, so it reads as unpublished
          # here and the publish below tries it again — npm refuses, which npm-publish.sh tolerates.
          if npm view "frizz-server@$SERVER_VERSION" version > /dev/null 2>&1; then
            echo "frizz-server@$SERVER_VERSION is already published"
            echo "publish_server=false" >> "$GITHUB_OUTPUT"
          else
            echo "frizz-server@$SERVER_VERSION is not on the registry; publishing"
            echo "publish_server=true" >> "$GITHUB_OUTPUT"
          fi
          if npm view "frizz@$SHELL_VERSION" version > /dev/null 2>&1; then
            echo "frizz@$SHELL_VERSION is already published"
            echo "publish_shell=false" >> "$GITHUB_OUTPUT"
          else
            echo "frizz@$SHELL_VERSION is not on the registry; publishing"
            echo "publish_shell=true" >> "$GITHUB_OUTPUT"
          fi

      # Root prepack stages this package before either pack operation. `--ignore-scripts` makes the
      # server tarball exactly the staging that the shell's local artifact tests consume; it avoids a
      # second, package-directory lifecycle that cannot see the source workspace.
      - name: Build and publish frizz-server to npm
        if: steps.decide.outputs.publish_server == 'true'
        run: |
          node ./scripts/prepare-package.mjs --server
          node ./scripts/build-package.mjs --server
          bash .github/scripts/npm-publish.sh ./packages/server-release --ignore-scripts

      # THE ORDERING GATE. The shell below must not go live before npm serves the server it boots
      # (see the header), and a direct publish is not served until npm's review finishes. No `if:`:
      # on a retry the server was published by an earlier run and may still be in review, and a
      # version npm already serves returns at once.
      - name: Wait for npm to serve frizz-server
        env:
          SERVER_VERSION: ${{ steps.decide.outputs.server_version }}
        run: bash .github/scripts/npm-wait-served.sh frizz-server "$SERVER_VERSION"

      # Shell prepack creates its launcher bundle, leaves server staging intact for future standalone
      # packs, and strips workspace-only development links from the root manifest.
      #
      # The server the shell pins in `frizzServer.version` is usually the one this run just waited
      # for, but a shell may pin an older server that an earlier run published. This run publishes
      # no other server version, so a pin npm does not serve by now never arrives: refuse, rather
      # than ship a shell with no server behind it.
      - name: Publish the frizz shell to npm
        if: steps.decide.outputs.publish_shell == 'true'
        run: |
          PINNED_SERVER=$(node -p "require('./package.json').frizzServer.version")
          curl -sf "https://registry.npmjs.org/frizz-server/$PINNED_SERVER" > /dev/null \
            || { echo "::error::the shell pins frizz-server@$PINNED_SERVER, which npm does not serve; publish that server first"; exit 1; }
          bash .github/scripts/npm-publish.sh .

      # The tag and the GitHub release below describe a published version, so they wait for npm to
      # serve the shell. No `if:`, for the same retry reason as the server wait.
      - name: Wait for npm to serve frizz
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: bash .github/scripts/npm-wait-served.sh frizz "$VERSION"

      # Tags and GitHub releases belong to the stable shell only. This reconciliation deliberately
      # runs even when the registry check skipped publishing: a retry after npm accepted the tarball
      # but GitHub tagging/release creation failed must repair the missing metadata. The tag target is
      # npm's recorded gitHead, never this workflow's checkout: a later server-only release can run at
      # a newer commit while the shell version remains unchanged.
      - name: Tag the released shell commit
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already tagged; nothing to do"
            exit 0
          fi
          GIT_HEAD=$(node scripts/published-git-head.mjs frizz "$VERSION")
          if ! printf '%s' "$GIT_HEAD" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "frizz@$VERSION has no valid npm gitHead; refusing to tag this workflow checkout" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$GIT_HEAD"
          git cat-file -e "$GIT_HEAD^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$GIT_HEAD" -m "frizz v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub shell release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "the v$VERSION release already exists; nothing to do"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "frizz v$VERSION" \
            --notes "Published to npm: https://www.npmjs.com/package/frizz/v/$VERSION" \
            --verify-tag
